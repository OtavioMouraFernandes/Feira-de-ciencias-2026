<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz | El Niño</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><a class="logo" href="index.html">CLIMA<span>+</span></a><div><a href="index.html">Início</a><a href="index.html#trabalhos">Trabalhos</a><a href="quiz.html">Quiz</a></div></nav>
<header class="hero small"><div><span class="tag">QUIZ</span><h1>Quanto você sabe sobre o El Niño?</h1><p>10 perguntas. Escolha uma resposta e veja a explicação.</p></div></header>
<section>
  <div class="quiz" id="quiz">
    <div class="progress"><i id="bar"></i></div>
    <div class="qcount" id="qcount"></div>
    <div id="area"></div>
  </div>
</section>
<footer>Projeto escolar • El Niño • 2026</footer>

<script>
const perguntas = [
 {q:'O que é o El Niño?', o:['O resfriamento anormal das águas do Atlântico','O aquecimento anormal das águas superficiais do Pacífico Equatorial','Um tipo de furacão que se forma no Caribe','Uma corrente de ar frio vinda da Antártida'], c:1, e:'O El Niño é o aquecimento anormal das águas superficiais do Oceano Pacífico Equatorial.'},
 {q:'Em qual oceano o El Niño tem origem?', o:['Pacífico','Atlântico','Índico','Ártico'], c:0, e:'O fenômeno começa no Pacífico Equatorial e afeta a atmosfera em escala global.'},
 {q:'De onde vem o nome "El Niño"?', o:['De uma cidade da Espanha','De um cientista chamado Niño','De pescadores sul-americanos, que notaram o aquecimento das águas perto do Natal, e "o menino" se refere ao menino Jesus','Do nome de uma tempestade que atingiu o Peru'], c:2, e:'Pescadores da costa do Peru e do Equador notavam o aquecimento das águas por volta do Natal e o chamaram de "El Niño" (o menino), em referência ao menino Jesus.'},
 {q:'Em condições normais, para onde sopram os ventos alísios no Pacífico Equatorial?', o:['De oeste para leste','Do norte para o sul','Do sul para o norte','De leste para oeste'], c:3, e:'Os alísios sopram de leste para oeste. Durante o El Niño eles se enfraquecem, e a água quente se espalha em direção ao leste.'},
 {q:'Qual é o fenômeno oposto ao El Niño, com resfriamento anormal das águas do Pacífico?', o:['La Niña','El Sol','Monção','Maré vermelha'], c:0, e:'A La Niña é a fase fria do mesmo sistema, com águas do Pacífico Equatorial mais frias que o normal.'},
 {q:'O El Niño costuma ocorrer a cada…', o:['Todo ano, sempre no verão','Cerca de 2 a 7 anos, sem intervalo exato','A cada 100 anos','Todo mês de dezembro'], c:1, e:'Ele ocorre de forma irregular, em média a cada 2 a 7 anos.'},
 {q:'Qual região do Brasil costuma ter mais chuva em anos de El Niño?', o:['Sul','Norte','Nordeste (semiárido)','Nenhuma região é afetada'], c:0, e:'O Sul costuma ter chuvas acima da média, enquanto partes do Norte e do Nordeste tendem a ter menos chuva e mais seca.'},
 {q:'Qual atividade pode ser prejudicada no Peru durante um El Niño forte?', o:['A produção de petróleo no deserto','A pesca, pela queda de peixes como a anchova','O turismo de neve','A extração de sal'], c:1, e:'As águas quentes reduzem os nutrientes na superfície e afastam os peixes, o que prejudica a pesca.'},
 {q:'O que significa a sigla ENOS?', o:['Estação Nacional de Observação Solar','Energia Natural dos Oceanos do Sul','El Niño–Oscilação Sul','Evento Natural de Ondas Sazonais'], c:2, e:'ENOS é El Niño–Oscilação Sul, o sistema que liga as mudanças no oceano às da pressão atmosférica.'},
 {q:'Por que os efeitos do El Niño não são iguais em todos os eventos?', o:['Porque o fenômeno só acontece em alguns países','Porque depende da intensidade, da época do ano e de outros fatores climáticos','Porque os cientistas mudam as medições','Porque os efeitos sempre são idênticos'], c:1, e:'Intensidade, período e outros sistemas climáticos fazem cada evento ter efeitos diferentes.'}
];

const area = document.getElementById('area'), bar = document.getElementById('bar'), qcount = document.getElementById('qcount');
let i = 0, pontos = 0;

function mostrar() {
  const p = perguntas[i];
  bar.style.width = (i / perguntas.length * 100) + '%';
  qcount.textContent = `Pergunta ${i+1} de ${perguntas.length}`;
  area.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = p.q; area.appendChild(h);
  const opts = document.createElement('div'); opts.className = 'opts';
  p.o.forEach((t, k) => {
    const b = document.createElement('button'); b.className = 'opt'; b.textContent = t;
    b.onclick = () => responder(k, opts, exp, prox);
    opts.appendChild(b);
  });
  const exp = document.createElement('div'); exp.className = 'explain-box';
  const prox = document.createElement('button'); prox.className = 'btn'; prox.style.display = 'none';
  prox.textContent = i === perguntas.length - 1 ? 'Ver resultado' : 'Próxima pergunta';
  prox.onclick = () => { i++; i < perguntas.length ? mostrar() : final(); };
  area.append(opts, exp, prox);
}

function responder(k, opts, exp, prox) {
  const p = perguntas[i];
  [...opts.children].forEach((b, j) => {
    b.disabled = true;
    if (j === p.c) b.classList.add('correct');
    else if (j === k) b.classList.add('wrong');
  });
  if (k === p.c) pontos++;
  exp.textContent = (k === p.c ? 'Correto! ' : 'Não foi dessa vez. ') + p.e;
  exp.classList.add('show'); prox.style.display = 'inline-block';
}

function final() {
  bar.style.width = '100%'; qcount.textContent = 'Quiz concluído';
  const msg = pontos >= 9 ? 'Excelente! Você entende bem o El Niño.' : pontos >= 6 ? 'Muito bom! Você já sabe bastante.' : 'Revise os trabalhos das turmas e tente de novo.';
  area.innerHTML = `<div class="result"><p>Você acertou</p><div class="score">${pontos}/${perguntas.length}</div><p>${msg}</p><button class="btn" id="again">Refazer o quiz</button> <a class="btn ghost" href="index.html#trabalhos">Ver trabalhos</a></div>`;
  document.getElementById('again').onclick = () => { i = 0; pontos = 0; mostrar(); };
}
mostrar();
</script>
</body></html>
